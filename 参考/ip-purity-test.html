<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="检测当前出口 IP 的类型与风险，以及能否直连 ChatGPT 和 Claude。纯前端，无后端。">
<title>IP 纯净度测试</title>

  try { var saved = localStorage.getItem('ipq.theme'); if (saved === 'light' || saved === 'dark') mode = saved; } catch (e) {}
  var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-mode', mode);
})();
</script>

<style>
/* IP 纯净度测试 — 冷调"清水"配色：蓝灰底 + 深青强调，状态色只用于表达结果 */
:root {
  color-scheme: light;
  --bg: #edf2f3;
  --topbar-bg: rgba(237, 242, 243, 0.86);
  --surface: #fbfdfd;
  --surface-2: #f1f6f7;
  --text: #10252c;
  --muted: #56717b;
  --line: #d5e2e5;
  --accent: #0b6f6a;
  --accent-text: #ffffff;
  --ok: #17743f;
  --ok-bg: #e1f3e8;
  --warn: #9a5708;
  --warn-bg: #fbefd6;
  --bad: #b3261e;
  --bad-bg: #fbe5e3;
  --neutral-bg: #e4edef;
  --skeleton: #e0eaec;
  --skeleton-hi: #f1f6f7;
  --shadow: 0 1px 2px rgba(16, 37, 44, 0.05), 0 12px 32px -16px rgba(16, 37, 44, 0.18);
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a1316;
  --topbar-bg: rgba(10, 19, 22, 0.86);
  --surface: #101d21;
  --surface-2: #0c181c;
  --text: #e2eef0;
  --muted: #8fa7ae;
  --line: #203238;
  --accent: #4cc9bd;
  --accent-text: #052321;
  --ok: #5fd68d;
  --ok-bg: #10301e;
  --warn: #f2b445;
  --warn-bg: #33260b;
  --bad: #ff8a80;
  --bad-bg: #3a1613;
  --neutral-bg: #18272c;
  --skeleton: #18272c;
  --skeleton-hi: #223439;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px -16px rgba(0, 0, 0, 0.6);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.65;
  color: var(--text);
  background: var(--bg);
}

code,
.ip {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--topbar-bg);
  border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}

.topbar-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.brand h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: 0.01em;
}

.brand-sub {
  margin: 2px 0 0;
  font-size: 13px;
  color: var(--muted);
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background-color 0.15s, filter 0.15s;
}

.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
}

.btn--primary:hover {
  color: var(--accent-text);
  filter: brightness(1.1);
}

.btn:disabled {
  opacity: 0.65;
  cursor: progress;
  filter: none;
}

.btn:disabled:hover {
  border-color: var(--accent);
  color: var(--accent-text);
}

.btn--sm {
  min-height: 30px;
  padding: 3px 12px;
  font-size: 13px;
}

/* ---------- 版面 ---------- */
.layout {
  max-width: 1120px;
  margin: 0 auto;
  padding: 24px;
  display: grid;
  gap: 24px;
}

.card-title,
.section-title {
  margin: 0 0 14px;
  font-size: 15px;
  font-weight: 700;
  color: var(--muted);
}

.section-title {
  font-size: 16px;
  color: var(--text);
}

.note {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--muted);
}

/* 顶部结论区：评分 + 出口 IP 并排 */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.hero-score,
.hero-ip {
  min-width: 0;
  padding: 24px 28px 26px;
}

.hero-ip {
  background: var(--surface-2);
  border-left: 1px solid var(--line);
}

.details {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  align-items: start;
}

.panel {
  min-width: 0;
  padding: 18px 20px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}

/* ---------- 出口 IP ---------- */
.ip-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.ip {
  font-size: clamp(22px, 3.4vw, 32px);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.01em;
  word-break: break-all;
}

.rows {
  margin: 0;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.row:last-child {
  border-bottom: 0;
}

.row dt {
  flex: 0 0 auto;
  color: var(--muted);
}

.row dd {
  margin: 0;
  text-align: right;
  word-break: break-all;
}

/* ---------- 标签 ---------- */
.badge-line {
  margin: 0 0 10px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 11px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.badge::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.badge--ok {
  color: var(--ok);
  background: var(--ok-bg);
}

.badge--warn {
  color: var(--warn);
  background: var(--warn-bg);
}

.badge--bad {
  color: var(--bad);
  background: var(--bad-bg);
}

.badge--muted {
  color: var(--muted);
  background: var(--neutral-bg);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.chip {
  display: inline-flex;
  align-items: center;
  padding: 3px 11px;
  border-radius: 999px;
  font-size: 13px;
  border: 1px solid var(--line);
  color: var(--muted);
  background: var(--neutral-bg);
}

.chip--ok {
  color: var(--ok);
  background: var(--ok-bg);
  border-color: transparent;
}

.chip--warn {
  color: var(--warn);
  background: var(--warn-bg);
  border-color: transparent;
}

.chip--bad {
  color: var(--bad);
  background: var(--bad-bg);
  border-color: transparent;
}

/* ---------- 表格 ---------- */
.table-wrap {
  overflow-x: auto;
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.table th,
.table td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  word-break: break-all;
}

.table th:first-child,
.table td:first-child {
  padding-left: 0;
}

.table th {
  font-weight: 500;
  color: var(--muted);
}

.table .c-fixed {
  white-space: nowrap;
  word-break: keep-all;
}

.table tr:last-child td {
  border-bottom: 0;
}

.t-ok {
  color: var(--ok);
}

.t-bad {
  color: var(--bad);
}

.t-muted {
  color: var(--muted);
}

/* ---------- 评分 ---------- */
.score-body {
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
}

.gauge {
  flex: 0 0 auto;
  width: 148px;
  height: 148px;
}

.gauge-track,
.gauge-value {
  fill: none;
  stroke-width: 9;
}

.gauge-track {
  stroke: var(--skeleton);
}

.gauge-value {
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 60px 60px;
  transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 0.8, 0.3, 1);
}

.gauge-value--good {
  stroke: var(--ok);
}

.gauge-value--warn {
  stroke: var(--warn);
}

.gauge-value--bad {
  stroke: var(--bad);
}

.gauge-num {
  font-size: 34px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  fill: var(--text);
}

.gauge-unit {
  font-size: 11px;
  fill: var(--muted);
}

.score-text {
  flex: 1 1 180px;
  min-width: 0;
}

.score-text p {
  margin: 6px 0 0;
  font-size: 14px;
}

.grade {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.25;
}

.grade--good {
  color: var(--ok);
}

.grade--warn {
  color: var(--warn);
}

.grade--bad {
  color: var(--bad);
}

/* ---------- AI 服务 ---------- */
.svc-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.svc {
  min-width: 0;
  padding: 16px 20px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 5px solid var(--status, var(--line));
  border-radius: 12px;
}

.svc--ok {
  --status: var(--ok);
}

.svc--risk {
  --status: var(--warn);
}

.svc--region,
.svc--blocked {
  --status: var(--bad);
}

.svc-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.svc-name {
  font-size: 17px;
  font-weight: 700;
}

.svc-vendor {
  margin-left: 8px;
  font-size: 13px;
  font-weight: 400;
  color: var(--muted);
}

.svc-sub {
  font-size: 13px;
  color: var(--muted);
  word-break: break-all;
}

.svc-link {
  margin-top: 12px;
}

/* ---------- 评分明细 ---------- */
.items {
  list-style: none;
  margin: 0;
  padding: 0;
}

.items li {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 2px 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.items li:last-child {
  border-bottom: 0;
}

.items .ev {
  flex-basis: 100%;
  font-size: 13px;
  color: var(--muted);
}

.ded--hit {
  color: var(--bad);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.ded--zero {
  color: var(--ok);
}

.ded--miss {
  color: var(--muted);
}

.advice-title {
  margin: 18px 0 4px;
  font-size: 14px;
  font-weight: 700;
}

.advice {
  margin: 0;
  padding-left: 18px;
  font-size: 14px;
}

.advice li {
  margin: 6px 0;
}

/* ---------- 加载骨架 ---------- */
.skeleton {
  height: 14px;
  margin: 10px 0;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--skeleton) 25%, var(--skeleton-hi) 50%, var(--skeleton) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}

.skeleton--lg {
  height: 28px;
  width: 55%;
}

.skeleton--w40 {
  width: 40%;
}

.skeleton--w60 {
  width: 60%;
}

.skeleton--w80 {
  width: 80%;
}

.skeleton--full {
  width: 100%;
}

@keyframes shimmer {
  to {
    background-position: -200% 0;
  }
}

/* ---------- 页脚 ---------- */
.footer {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 24px 40px;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--muted);
}

.footer-links a {
  color: var(--accent);
  text-decoration: none;
}

.footer-links a:hover {
  text-decoration: underline;
}

/* ---------- 响应式 ---------- */
@media (max-width: 860px) {
  .details,
  .svc-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 720px) {
  .layout {
    padding: 16px;
    gap: 16px;
  }

  .topbar-inner {
    padding: 10px 16px;
  }

  .hero {
    grid-template-columns: minmax(0, 1fr);
  }

  .hero-score,
  .hero-ip {
    padding: 20px;
  }

  .hero-ip {
    border-left: 0;
    border-top: 1px solid var(--line);
  }

  .footer {
    padding: 0 16px 32px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .skeleton {
    animation: none;
  }

  .gauge-value,
  .btn {
    transition: none;
  }
}

</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>IP 纯净度测试</h1>
      <p class="brand-sub">检测当前出口 IP 的类型与风险，以及能否直连 ChatGPT 和 Claude</p>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="theme-btn">主题：跟随系统</button>
      <button type="button" class="btn btn--primary" id="rerun-btn">重新检测</button>
    </div>
  </div>
</header>

<main class="layout">
  <div class="hero">
    <section class="hero-score" aria-live="polite" aria-labelledby="t-score">
      <h2 class="card-title" id="t-score">纯净度评分</h2>
      <div id="score-body"></div>
    </section>
    <section class="hero-ip" aria-labelledby="t-ip">
      <h2 class="card-title" id="t-ip">当前出口 IP</h2>
      <div id="ip-body"></div>
    </section>
  </div>

  <section class="ai" aria-labelledby="t-ai">
    <h2 class="section-title" id="t-ai">AI 服务可用性</h2>
    <div class="svc-grid" id="ai-body"></div>
    <p class="note">脚本无法判断网页版是否弹出 Cloudflare 人机验证。如果打开后反复要求验证，说明该 IP 已被重点标记，请以实际打开结果为准。</p>
  </section>

  <div class="details">
    <section class="panel" aria-labelledby="t-risk">
      <h2 class="card-title" id="t-risk">IP 类型与风险</h2>
      <div id="risk-body"></div>
    </section>

    <section class="panel" aria-labelledby="t-cons">
      <h2 class="card-title" id="t-cons">出口 IP 一致性</h2>
      <div id="consistency-body"></div>
    </section>

    <section class="panel" aria-labelledby="t-rtc">
      <h2 class="card-title" id="t-rtc">WebRTC 泄漏</h2>
      <div id="webrtc-body"></div>
    </section>

    <section class="panel" aria-labelledby="t-detail">
      <h2 class="card-title" id="t-detail">评分明细与建议</h2>
      <div id="detail-body"></div>
    </section>
  </div>
</main>

<footer class="footer">
  <p class="note">所有请求由浏览器直接发往第三方服务（Cloudflare、IPinfo、OpenAI、Anthropic 等），本页面没有后端，不收集任何数据。结果仅反映检测时刻的网络状态，评分仅供参考。</p>
  <nav class="footer-links" id="footer-links"></nav>
</footer>

(function (IPQ) {

            '<circle class="gauge-value gauge-value--' + g.key + '" cx="60" cy="60" r="52" stroke-dasharray="' + CIRC.toFixed(1) + '" stroke-dashoffset="' + CIRC.toFixed(1) + '"></circle>' +

          : '该服务看到的出口：无法获取';

        return '<div class="svc svc--' + esc(v.status) + '">' +
          '<div class="svc-head"><div><div class="svc-name">' + esc(svc.name) + '<span class="svc-vendor">' + esc(svc.vendor) + '</span></div>' +
          '<div class="svc-sub">' + sub + '</div></div>' +
          '<span class="badge ' + STATUS_BADGE[v.status] + '">' + esc(v.label) + '</span></div>' +

          '<a class="btn btn--sm svc-link" href="' + svc.site + '" target="_blank" rel="noopener noreferrer">在新标签页打开 ' + esc(svc.host) + ' 实测</a>' +

(function (IPQ) {
  'use strict';

  var API = IPQ.API;
  var CHECKS = IPQ.CHECKS;
  var SCORE = IPQ.SCORE;
  var UI = IPQ.UI;
  var DATA = IPQ.DATA;

  var runId = 0;
  var controller = null;
  var results = null;

  function isV4(ip) {
    return /^\d{1,3}(\.\d{1,3}){3}$/.test(ip || '');
  }

  function verdicts() {
    return DATA.services.map(function (svc) {
      var res = results.services[svc.id];
      return { svc: svc, verdict: res ? CHECKS.verdict(svc, res, results.intel) : null };
    });
  }

  function renderServices() {
    UI.renderServices(verdicts());
  }

  function consistencyData() {
    var exitIp = results.exit && results.exit.ip;
    var pending = !results.exit || results.ipv6 === undefined ||
      DATA.services.some(function (svc) { return !results.services[svc.id]; });
    if (pending) return { pending: true };
    var rows = [];
    if (exitIp) rows.push({ source: results.exit.source, ip: exitIp });
    DATA.services.forEach(function (svc) {
      var res = results.services[svc.id];
      if (res.trace.ok) {
        var t = API.parseTrace(res.trace.data);
        if (t.ip) rows.push({ source: svc.name, ip: t.ip });
      }
    });
    if (results.ipv6) rows.push({ source: 'IPv6 探测', ip: results.ipv6 });
    var v4 = rows.filter(function (r) { return isV4(r.ip); }).map(function (r) { return r.ip; });
    var distinct = v4.filter(function (ip, i) { return v4.indexOf(ip) === i; });
    return {
      pending: false,
      rows: rows,
      exitIp: exitIp,
      refV4: v4.length ? v4[0] : null,
      distinct: distinct.length,
      mismatch: distinct.length >= 2 ? true : v4.length >= 2 ? false : null,
      dualStack: !!results.ipv6 && isV4(exitIp)
    };
  }

  function renderConsistency() {
    UI.renderConsistency(consistencyData());
  }

  function renderWebrtc() {
    if (!results.webrtc) return; // still gathering: keep the skeleton instead of a false "unsupported"
    UI.renderWebrtc(CHECKS.classifyAddresses(results.webrtc, results.exit && results.exit.ip));
  }

  function renderScore() {
    var score = SCORE.compute({
      exitIp: results.exit && results.exit.ip,
      intel: results.intel || null,
      consistency: consistencyData(),
      webrtc: CHECKS.classifyAddresses(results.webrtc, results.exit && results.exit.ip),
      services: verdicts().filter(function (v) { return v.verdict; }).map(function (v) {
        return { name: v.svc.name, status: v.verdict.status };
      })
    });
    UI.renderScore(score);
    UI.renderDetail(score);
    UI.renderFooterLinks(results.exit && results.exit.ip);
  }

  function run() {
    var id = ++runId;
    if (controller) controller.abort();
    controller = new AbortController();
    var signal = controller.signal;
    var isCurrent = function () { return id === runId; };

    results = { exit: null, intel: undefined, services: {}, ipv6: undefined, webrtc: null };
    UI.reset();
    UI.setBusy(true);

    var exitP = CHECKS.exitIp(signal).then(function (exit) {
      if (!isCurrent()) return;
      results.exit = exit;
      UI.renderExit(exit, null);
      renderWebrtc();
      if (!exit.ip) {
        results.intel = null;
        UI.renderRisk(null);
        renderServices();
        return;
      }
      return CHECKS.intel(exit.ip, signal, exit).then(function (intel) {
        if (!isCurrent()) return;
        results.intel = intel || null;
        UI.renderExit(exit, results.intel);
        UI.renderRisk(results.intel);
        renderServices();
      }, function (err) {
        if (!isCurrent()) return;
        console.error(err);
        results.intel = null;
        UI.renderRisk(null);
        renderServices();
      });
    });

    var servicePs = DATA.services.map(function (svc) {
      return CHECKS.service(svc, signal).then(function (res) {
        if (!isCurrent()) return;
        results.services[svc.id] = res;
        renderServices();
        renderConsistency();
      });
    });

    var ipv6P = CHECKS.ipv6(signal).then(function (ip) {
      if (!isCurrent()) return;
      results.ipv6 = ip;
      renderConsistency();
    });

    var webrtcP = CHECKS.webrtc(signal).then(function (r) {
      if (!isCurrent()) return;
      results.webrtc = r;
      renderWebrtc();
    });

    function finish() {
      if (!isCurrent()) return;
      renderConsistency();
      renderScore();
      UI.setBusy(false);
    }

    Promise.all([exitP].concat(servicePs, [ipv6P, webrtcP])).then(finish, function (err) {
      console.error(err);
      finish();
    });
  }

  UI.init({ onRerun: run });
  run();
})(window.IPQ = window.IPQ || {});

</script>
